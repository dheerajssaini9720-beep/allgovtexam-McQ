<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF – Exam Mantra MCQ</title>
<meta name="description" content="Open or download PDF notes and study material for government exams.">
<link rel="icon" type="image/png" href="favicon.png">

<style>
    *{box-sizing:border-box}
    body{margin:0;padding:15px;background:#f1f3f6;font-family:Arial,sans-serif;color:#222}
    .page-box{max-width:900px;margin:15px auto;padding:22px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    h1{color:#153c82;margin-top:0}

    .search{width:100%;padding:12px 14px;font-size:15px;border:1px solid #cfd8ea;border-radius:10px;outline:none;margin-bottom:14px}
    .search:focus{border-color:#153c82}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
    .card{display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:14px;border:1px solid #dbe3f3;border-radius:12px;background:#f8faff}
    .card .top{display:flex;gap:10px;align-items:center}
    .card .icon{font-size:28px;line-height:1}
    .card .title{font-weight:700;color:#153c82;font-size:15px;line-height:1.4}
    .card .btns{display:flex;gap:8px}
    .card .btns a{flex:1;text-align:center;padding:9px 10px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700}
    .btn-open{background:#e65100;color:#fff}
    .btn-dl{background:#fff;color:#e65100;border:1px solid #e65100}

    .empty{text-align:center;color:#777;padding:30px 10px}
    .back-link{display:inline-block;margin-top:24px;color:#1a56db;text-decoration:none;font-weight:700}
    .wa-btn{display:inline-block;margin-top:14px;background:#25d366;color:#fff;padding:10px 18px;border-radius:25px;text-decoration:none;font-weight:700;font-size:14px}
</style>
</head>
<body>

<div class="page-box">

    <h1>📄 PDF</h1>

    <input id="search" class="search" type="search" placeholder="🔍 Search PDF">
    <div id="grid" class="grid"></div>

    <a class="wa-btn" href="https://whatsapp.com/channel/0029VbE6xBH3WHTOrIS2uR21" target="_blank" rel="noopener">💬 Join WhatsApp Channel for Updates</a>
    <br>
    <a class="back-link" href="index.html">← Back to Home</a>
</div>

<script>
/* =====================================================
   NAYI PDF ADD KARNE KA TARIKA:
   1. PDF ko "question-papers" folder mein rakho
   2. Neeche list mein uska file name likho (folder mein jo naam hai bilkul wahi)
   Koi bhi naam chalega (space, Hindi, capital). Apna title chahiye to:
      ["mera file.pdf", "Mera Title"],
   ===================================================== */

const FOLDER = "question-papers/";

const FILES = [
    "up-police-pdf-2025.pdf",
    "up-police-pdf-2025.pdf-2.pdf",
    "AllGovExamMCQ_SSC-CGL_Full_Set1_100Q--d2.pdf"
    
    // "maths-notes-hindi.pdf",
    // ["SSC Notes 1.pdf", "SSC Maths Notes"],
];

/* ---------------- yahan se neeche kuch change nahi karna ---------------- */

function makeItem(entry){
    // entry: "naam.pdf"  ya  ["naam.pdf", "Apna Title"]
    let file = Array.isArray(entry) ? entry[0] : entry;
    let custom = Array.isArray(entry) ? entry[1] : "";
    file = file.trim();
    if(!/\.pdf$/i.test(file)) file += ".pdf";      // .pdf nahi likha to apne aap lag jayega
    const base = file.replace(/\.pdf(\.pdf)?$/i, "");
    const auto = base.split(/[-_ ]+/).map(w =>
        /^(ssc|cgl|chsl|mts|rrb|ibps|sbi|po|up|gk|ntpc|rbi)$/i.test(w) ? w.toUpperCase()
        : w.charAt(0).toUpperCase() + w.slice(1)
    ).join(" ");
    return { title: custom || auto, url: FOLDER + encodeURIComponent(file) };
}

const items = FILES.map(makeItem);
const grid = document.getElementById("grid");
const search = document.getElementById("search");

function render(){
    const q = search.value.trim().toLowerCase();
    const list = items.filter(i => !q || i.title.toLowerCase().includes(q));
    if(!list.length){
        grid.innerHTML = '<div class="empty">Koi PDF nahi mili 😕</div>';
        return;
    }
    grid.innerHTML = list.map(i => `
        <div class="card">
            <div class="top">
                <div class="icon">📄</div>
                <div class="title">${i.title}</div>
            </div>
            <div class="btns">
                <a class="btn-open" href="${i.url}" target="_blank" rel="noopener">Open</a>
                <a class="btn-dl" href="${i.url}" download>Download</a>
            </div>
        </div>`).join("");
}

search.addEventListener("input", render);
render();
</script>

</body>
</html>
